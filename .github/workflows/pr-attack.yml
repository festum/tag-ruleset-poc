name: pr-attack

on:
  pull_request:

permissions:
  contents: write

jobs:
  attack-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Try force-pushing tag with GITHUB_TOKEN
        run: |
          git config user.name "attacker"
          git config user.email "attacker@example.com"
          git tag -fa v1.0 -m "attack"
          git push origin v1.0 --force
  attack-environment:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Try using release secret from PR branch
        run: echo "REACHED_ENV_JOB=true"
